name: Track prices

on:
  schedule:
    - cron: "17 * * * *"     # every hour
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # needed to save prices.json back to the repo

concurrency: track

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # The PC runs every 15 minutes and records the time in the LAST_PC_RUN variable.
      # While it is running, this hourly backup sits out so the same deal isn't sent twice.
      - name: Skip if the PC is running
        id: pc
        run: |
          last="${{ vars.LAST_PC_RUN }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$last" ] && [ $(( $(date +%s) - last )) -lt 2700 ]; then
            echo "PC ran $(( ($(date +%s) - last) / 60 )) minutes ago, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pc.outputs.skip != 'true'
        uses: actions/checkout@v4
      - if: steps.pc.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.pc.outputs.skip != 'true'
        run: pip install -r requirements.txt
      - if: steps.pc.outputs.skip != 'true'
        run: python tracker.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DROP_PERCENT: "10"
          DISCOVER_DROP: "25"
          LISTED_DISCOUNT: "50"
          TZ: Africa/Cairo        # for the daily summary time
      - name: Save price history
        if: steps.pc.outputs.skip != 'true'
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          for f in prices.json discovered.json sent.json settings.json health.json; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "Update prices"
          git push || { git pull --rebase -X theirs && git push; }
